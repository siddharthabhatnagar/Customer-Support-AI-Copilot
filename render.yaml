services:
  - type: web
    name: customer-support-ai-copilot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: PYTHON_VERSION
        value: 3.12.10
